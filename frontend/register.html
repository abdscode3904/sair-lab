<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | Sair Lab</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<header class="navbar">

    <a
        href="index.html"
        class="brand"
    >
        <span class="brand-mark">S</span>
        <span>SAIR LAB</span>
    </a>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>


<main class="auth-page">

    <section class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                S
            </div>

            <h1>
                Create your account
            </h1>

            <p>
                Start automating Excel and CSV files.
            </p>

        </div>


        <form id="registerForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

            </div>


            <div
                id="formMessage"
                class="form-message"
            ></div>


            <button
                type="submit"
                class="primary-button auth-button"
            >
                Create Account
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </section>

</main>


<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
